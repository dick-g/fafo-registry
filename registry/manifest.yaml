# FAFO Document Manifest
# Resolves a stable key to the current document, version, and Drive ID.
# Cite documents by KEY, not by filename. Filenames change; keys don't.


meta:
  version: "1.2"
  updated: 2026-08-05
  coverage: partial
  scope: >
    Active canon verified 2026-07-27 through 2026-07-29, plus governing
    rulings and key references. Not yet a complete corpus inventory.
  extend_by: >
    Add or update an entry every time a document is created or version-bumped.
    NOTE: a version bump creates a NEW Google Doc with a NEW drive_id, because
    neither Claude nor Cowork can edit or rename a Drive file in place. Every
    lock therefore invalidates this file until it is updated. Prefer a batch
    sync at the end of a phase over a fix after every micro-edit.


