# --- COVERAGE HONESTY (added v0.7) ---
# The manifest is the source of truth for whether a document exists, but its
# coverage is PARTIAL. Silence here is NOT evidence a document was never
# written. Until coverage is complete, confirm absence against the Ledger too.
existence_rule:
  manifest_is_authoritative_for: [version, drive_id, folder, status]
  manifest_silence_proves_nonexistence: false
  on_silence: "check the Ledger before concluding a document does not exist"
  known_absent:
    note: >
      Real, locked documents not yet carrying a manifest key as of v0.7.
      Scheduled for v0.8. Their Drive IDs were not re-verified in this pass
      and are deliberately omitted rather than asserted from memory.
    documents:
      - vampire_template_base
      - degeneration
      - discipline_chains_core_five
      - thaumaturgy_subsystem
      - path_of_blood
      - movement_of_the_mind
      - lure_of_flames
      - path_of_conjuring
      - universal_rebirth_framework
      - kindred_rebirth
      - clan_documents_all_seven
      - gargoyle_template
      - mummy_template
      - diocesan_investigators
      - conversion_engine_static_reference
  known_stale:
    note: >
      Keys present below whose version was NOT re-verified in the v0.7 pass.
      Believed behind; do not treat their version or drive_id as current
      until confirmed.
    entries:
      inquisition_core: "carried at 1.0; Ledger and Society of Leopold v1.2 both cite 1.3"
      true_faith_extension: "carried at 1.0; Ledger cites 1.1"
