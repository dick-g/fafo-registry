# --- COVERAGE HONESTY (added v0.7, updated v0.8) ---
# The manifest is the source of truth for whether a document exists, but its
# coverage is PARTIAL. Silence here is NOT evidence a document was never
# written. Until coverage is complete, confirm absence against the Ledger too.
existence_rule:
  manifest_is_authoritative_for: [version, drive_id, folder, status]
  manifest_silence_proves_nonexistence: false
  on_silence: "check the Ledger before concluding a document does not exist"
  known_absent:
    note: >
      Real, locked documents not yet carrying a manifest key as of v0.8.
      Eleven remain, down from fifteen at v0.7. Their Drive IDs have not
      been re-verified and are deliberately omitted rather than asserted.
    documents:
      - vampire_template_base
      - degeneration
      - discipline_chains_core_five
      - thaumaturgy_subsystem
      - path_of_blood
      - movement_of_the_mind
      - lure_of_flames
      - path_of_conjuring
      - universal_rebirth_framework
      - kindred_rebirth
      - clan_documents_all_seven
      - mummy_template
