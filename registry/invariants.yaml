Path 1 is the right call and I'd have argued for it. Three things to fix before it locks.

The Diehard clause is null as written
PF1e: at exactly 0 HP a character is Disabled — they can already take a single move or standard action each round. No feat required. Diehard only matters below 0.

But FAFO overrides that. Physical States v1.2: "A vampire enters Torpor immediately upon reaching 0 Hit Points or lower." There is no Disabled window in FAFO — 0 HP is Torpor.

So "gains Diehard at 0 HP, until they fall below 0" describes a window that doesn't exist. Third time this pattern has appeared today — a clause that reads correctly because it's true in a system FAFO isn't using.

The fix makes it good. Frenzy delays the Torpor trigger: the character acts at 0 HP as if Disabled, and Torpor arrives when HP drops below 0. That's a real, limited durability upside — and it tiers cleanly against Ferocity, which runs all the way to −CON.

It contradicts XL-03, written an hour ago
XL-03 §2 says flatly: "Frenzy does NOT delay or prevent Torpor." A Diehard window is exactly that. XL-03 is still DRAFT, so amending now is cheap — but both documents have to move together.

It reverses a locked decision
Frenzy v1.0 locked: "No damage or Strength bonus... Revisit only if playtesting shows Frenzy feels toothless." You're revisiting on analysis rather than play — legitimate, because the lock's premise was "loss of control with durability upside," and v1.2 removed the upside. But it should be recorded as a reversal, not slipped in as an addition.

Also: §1 currently reads "Frenzy is a liability, not a combat enhancer." With +2/+2 that's no longer true, so it needs rewording.

Both documents below.


