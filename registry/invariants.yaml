The absent_systems block is the point. Everything else is what FAFO has. That block is what it doesn't — and all three bugs today came from clauses reaching for things in that list.

I also settled the penalty question against you rather than for you: PF1e penalties are untyped by convention and don't stack from identical sources, so Brujah −2 and the Hunger penalty are correct as written. penalties.must_be_typed: false with a note telling a checker not to flag them.

Once that's committed, Cowork gets meaningfully sharper — it can now catch the class of error that produced three bugs in one day.








