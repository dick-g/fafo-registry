What I changed from your draft
The Diehard clause became a Torpor-trigger amendment. "At exactly 0 HP the character acts as though Disabled; Torpor arrives below 0." That's the only version that isn't null, and it's recorded as an explicit one-step amendment to Physical States v1.2 §4 — applying to characters in Frenzy and nobody else.

Aggravated carved out. No window. 0 HP from fire or sunlight is still Final Death.

Ferocity subsumes rather than stacks. Anyone with both uses the Ferocity floor.

Two reversals recorded rather than absorbed — the no-damage-bonus lock, and the Torpor trigger. Both in XL-03 §4 and §7 with reasons, so a future reader finds a decision instead of a discrepancy.

§1 reworded. "Frenzy is a bargain, not a buff."

Why +2/−2 rather than a Strength bonus
Worth stating since you may revisit it: a Strength bonus ripples into carrying capacity, Climb, Swim, grapple, and thrown weapons — mostly things a frenzied character can't use anyway. Flat melee bonus plus AC penalty gives the same feel with one line of bookkeeping. That's in the design notes so the reasoning survives.

The pattern, third time today
Wound penalties. Health levels. Now Diehard. Each read correctly because it's true in the source system — Storyteller has wound penalties, baseline PF1e has a Disabled state at 0 HP — and each meant nothing in FAFO.

That's the strongest argument yet for wound_penalties: false, health_levels: false, and torpor_at_0_hp: true as explicit invariants. Not to state what FAFO has, but to state what it doesn't — so a checker flags any document reaching for them.

