  # --- ADDED v0.3: 2026-08-04 ---
  - id: 21
    status: open
    document: diablerie
    verdict: authorize
    gap: >
      A full Diablerie subsystem was authorized by project-lead ruling on
      2026-08-03 and has not been written. It needs its own document —
      kindred_rebirth declines it because Diablerie is not Rebirth by that
      document's own first principle, and the payload touches masters it does
      not own. Four mechanical seams to rule before it can be drafted, none
      of them a reason to weaken the power, each of them a reason to state
      how it works so the Pre-Draft Pass can check it later.
    seams:
      - >
        The permanent 1-step SPP cost reduction contradicts
        spp_advancement_table, which is master of spp_costs and dot_costs
        with a fixed 2/4/6/8/10 in-clan table and a 1.5 out-of-clan
        multiplier. A document that is not the SPP master cannot rewrite the
        cost table.
      - >
        "Blood Potency" is not a FAFO term. Blood Pool maximum and BP/Round
        are set by Tier in vampire_template_base.
      - >
        Tier elevation interacts with discipline_tier_floors (4/5/6/7) and
        with Tier never being purchased. A diablerist jumping a bracket
        instantly clears dot gates; the acquisition route needs stating.
      - >
        The free Discipline dot bypasses both the SPP economy and the tier
        floors.

  - id: 22
    status: open
    scope: garou
    gap: >
      The Garou line's COMPLETE status rests on GR-075, which is not an audit
      document. It states in its own words that it was reconstructed
      2026-07-27 from the Ledger v1.75 entry, that the pass itself ran
      2026-07-26 with no standalone document created at the time, and that
      its content is "the Ledger record, not a re-run of the audit." It
      carries five section headings and one line of result, with no findings
      and no per-document verdicts. Under the Audit Verdict Rule a document
      is audited when it has a recorded verdict; none of the 62 Garou files
      has one. Treat the line as UNAUDITED. Phase 1 (separating current from
      superseded, 14 files archived) is complete; Phase 2, the ~18-document
      architecture-layer audit, has not started.

  - id: 23
    status: open
    document: conversion_engine_architecture
    gap: >
      The Layered Rebuild Charter commits the Ledger to gain an ENGINE
      section — EN-001 layer model, EN-002 Three Laws, EN-003 test criteria —
      "at next ledger touch." As of ledger v2.16 no such section exists, yet
      EN-002 is cited by number in live Garou Gift documents for layer
      stacking and the nothing-lost-silently law. The numbering is in active
      use across the corpus with no definition recorded in the Ledger.

  - id: 24
    status: open
    scope: garou
    gap: >
      Three competing filename conventions for the same Gift content —
      "Gifts_Tribal_Rank_N", "Tribe_Gifts_Rank_N_Batch_M", and GR-numbered
      forms such as "Rank4_Breed_Gifts_Corpus_GR-035". Two byte-level
      duplicate pairs were found and archived at Phase 1, one of them a copy
      with all formatting stripped. Version numbers do not disambiguate these
      — both members of each pair were at v1.1. A naming convention should be
      chosen before the Gift corpus is audited.

