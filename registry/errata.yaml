  - id: 30
    status: open
    scope: corpus
    supersedes: 17
    gap: >
      THE REROLL ECONOMY. Six sources now grant a reroll running parallel to
      WP-001, which owns "reroll d20, keep second result." Multiple clean
      pools are legal under Manifesto Law 5, but this warrants ONE Law 5 check
      covering all six together rather than six separate ones. Absorbs item 17.
    sources:
      - "merits_and_flaws — Lucky, three d20 rerolls per session"
      - "merits_and_flaws — Iron Will, one Will-save reroll per session"
      - "garou_totem_system — Pack Reroll, Grade 2, once per day per pack"
      - "garou_delirium_and_veil — Willpower spend to improve reaction by one row"
      - "garou_tribes — Uktena Hidden Knowledge, Knowledge (occult) reroll"
      - "garou_tribes — Stargazers Centered Mind, Will save reroll"

  - id: 31
    status: resolved
    document: garou_rank_and_renown_advancement
    resolved_at_ledger: "2.44"
    gap: >
      SOCIAL-BONUS STACKING SWEEP. Five documents granted social bonuses of
      differing types that combine on the same check, and no document counted
      the total — it had to be assembled by reading all five. RESOLVED at
      ledger 2.44: garou_rank_and_renown_advancement v1.2 section 5a now
      carries the enumerated source table with types, values and conditions.
    findings: >
      Three things were established that had been stated nowhere. The +4
      affinity ceiling is UNREACHABLE ON DIPLOMACY — no Auspice grants
      Diplomacy affinity — and is reachable on exactly four skills where a
      Tribe and an Auspice overlap: Intimidate, Sense Motive, Perform, and
      Knowledge (occult). NO cumulative ceiling is imposed, because each bonus
      is already narrowly conditioned and a blanket cap would flatten five
      carefully-scoped grants into one blunt one. The theoretical maximum is
      +12, reached only by an Elder with Sovereign Lineage asserting hierarchy
      against a Rank 0 Cub, by two distinct routes.

  - id: 32
    status: standing_rule
    scope: corpus
    gap: >
      DRIVE ID DISCIPLINE. A Drive ID is taken from the file's own creation
      record or a Drive search, NEVER transcribed from a dispatch or a
      summary. Two single-character ID errors were caught in dispatches during
      the Garou Phase 2 audit — GR-020 v1.1 given as ...bwytzrWQ6... for
      ...bwytzrVQ6..., and garou_kinfolk_network v1.1 given with a trailing
      character it does not have. Either would have written a pointer to
      nothing into the Ledger and from there into the manifest. Same failure
      class as the mortal_baseline folder ID, which sat wrong in the manifest
      through four versions. Recorded in Ledger v2.42's header.

  - id: 33
    status: standing_rule
    document: garou_character_sheet_architecture
    gap: >
      CHARACTER SHEET RE-VERIFICATION. The character sheet is re-verified
      against its Line Masters at every corpus version bump, not only when the
      layout changes. Its v1.0 carried a "Tier 1 through Tier 8" field
      inherited from a table that had since been pruned to 1-5, and a
      Regeneration field reading "Pending Lock" two weeks after GR-045 locked
      it. A sheet re-verified only on layout change keeps inheriting stale
      numbers, and a sheet is what a player holds at the table — an error
      there reaches play directly. Stated in the document's own Presentation
      Rule as of v1.1.

  - id: 34
    status: recorded
    scope: project
    gap: >
      ENFORCEMENT SUITE VALIDATION — a finding, not a gap. The three Garou
      documents written AFTER the enforcement suite locked at Ledger v1.98 —
      garou_sept_and_caern_procedures, garou_temporary_traveling_caerns and
      garou_multi_sept_alliance, all 2026-07-25/26 — each carry an Authority
      Note recording defects caught and corrected BEFORE locking. No earlier
      document does. GR-063 self-caught three, GR-071 self-caught two and
      cites prior occurrences of the same error class at GR-021 and GR-026,
      and GR-070 arrived clean, which this audit verified. The defect rate in
      post-v1.98 documents is materially lower. Retained as the argument for
      keeping the Pre-Draft Registry Pass at the front of the pipeline when it
      feels like overhead.

