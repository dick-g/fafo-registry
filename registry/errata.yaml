  # --- ADDED v0.3: 2026-08-04 ---
  - id: 21
    status: open
    document: diablerie
    verdict: authorize
    gap: >
      A full Diablerie subsystem was authorized by project-lead ruling on
      2026-08-03 and has not been written. It needs its own document —
      kindred_rebirth declines it because Diablerie is not Rebirth by that
      document's own first principle, and the payload touches masters it does
      not own. Four mechanical seams to rule before it can be drafted, none
      of them a reason to weaken the power, each of them a reason to state
      how it works so the Pre-Draft Pass can check it later.
    seams:
      - >
        The permanent 1-step SPP cost reduction contradicts
        spp_advancement_table, which is master of spp_costs and dot_costs
        with a fixed 2/4/6/8/10 in-clan table and a 1.5 out-of-clan
        multiplier. A document that is not the SPP master cannot rewrite the
        cost table.
      - >
        "Blood Potency" is not a FAFO term. Blood Pool maximum and BP/Round
        are set by Tier in vampire_template_base.
      - >
        Tier elevation interacts with discipline_tier_floors (4/5/6/7) and
        with Tier never being purchased. A diablerist jumping a bracket
        instantly clears dot gates; the acquisition route needs stating.
      - >
        The free Discipline dot bypasses both the SPP economy and the tier
        floors.

