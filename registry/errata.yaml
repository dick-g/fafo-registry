# FAFO Errata & Gap Registry
# Machine-readable companion to the Master Canon Ledger's Gap List.
# The Ledger remains authoritative for what was decided and why; this file
# exists so open items survive session compression and can be queried.
#
# Item numbers are STABLE CITATION TARGETS and are never renumbered.
# Resolved items stay in place with status: resolved rather than being
# deleted, so a citation to "Gap List item 3" never silently retargets.

